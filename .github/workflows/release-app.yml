# Releasebuild van één moskee-app, alleen handmatig te starten. Bouwt en tekent; uploadt NIET naar de stores.
# Publiceren gebeurt met de hand in Play Console of App Store Connect, na de releasecontrole in WHITE_LABEL.md.
#
# Per merk een GitHub Environment met dezelfde naam als de slug (Settings > Environments), met:
#   secrets   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#             FIREBASE_ANDROID_API_KEY, FIREBASE_ANDROID_APP_ID, FIREBASE_IOS_API_KEY, FIREBASE_IOS_APP_ID
#   variables FIREBASE_PROJECT_ID, FIREBASE_MESSAGING_SENDER_ID
# Stel bij de Environment "Required reviewers" in, dan start een release pas na goedkeuring.
name: Release-app

on:
  workflow_dispatch:
    inputs:
      brand:
        description: Slug van het merk (map in brands/)
        required: true
        type: string
      platform:
        description: Platform
        required: true
        type: choice
        options: [android, ios]

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.brand }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  android:
    if: inputs.platform == 'android'
    name: Android-release (${{ inputs.brand }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.brand }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
      - name: Merk controleren en toepassen
        env:
          BRAND: ${{ inputs.brand }}
        run: |
          pip install -r design/requirements.txt
          node tools/brand/brand.mjs validate "$BRAND"
          node tools/brand/brand.mjs apply "$BRAND"
          # Faalt als brand.json geen backend.apiBaseUrl heeft: een release praat nooit met een standaardadres.
          url="$(node tools/brand/brand.mjs show "$BRAND" backend.apiBaseUrl)"
          echo "API_BASE_URL=$url" >> "$GITHUB_ENV"
      - name: Tests
        working-directory: frontend/app
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Bouwen en tekenen
        working-directory: frontend/app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD \
            FIREBASE_PROJECT_ID FIREBASE_MESSAGING_SENDER_ID FIREBASE_ANDROID_API_KEY FIREBASE_ANDROID_APP_ID; do
            if [ -z "${!name}" ]; then echo "::error::$name ontbreekt in Environment ${{ inputs.brand }}"; exit 1; fi
          done
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          flutter build appbundle --release \
            --build-number="${{ github.run_number }}" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_ANDROID_API_KEY="$FIREBASE_ANDROID_API_KEY" \
            --dart-define=FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_APP_ID"
          rm -f "$ANDROID_KEYSTORE_PATH"
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab | grep -q "jar verified"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.brand }}-android-${{ github.run_number }}
          path: frontend/app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  ios:
    if: inputs.platform == 'ios'
    name: iOS-build (${{ inputs.brand }})
    runs-on: macos-latest
    environment: ${{ inputs.brand }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # De iconen worden met cairo gegenereerd; op macOS komt die uit Homebrew.
      - name: Merk controleren en toepassen
        env:
          BRAND: ${{ inputs.brand }}
        run: |
          brew install cairo
          export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix)/lib"
          pip install -r design/requirements.txt
          node tools/brand/brand.mjs validate "$BRAND"
          node tools/brand/brand.mjs apply "$BRAND"
          # Faalt als brand.json geen backend.apiBaseUrl heeft: een release praat nooit met een standaardadres.
          url="$(node tools/brand/brand.mjs show "$BRAND" backend.apiBaseUrl)"
          echo "API_BASE_URL=$url" >> "$GITHUB_ENV"
      # Ondertekenen en uploaden vereisen een Apple Developer-account met certificaat en provisioningprofiel;
      # tot die er zijn, bouwt deze job een ongetekend archief om te controleren dat de release bouwt.
      - name: Bouwen (ongetekend)
        working-directory: frontend/app
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_IOS_API_KEY: ${{ secrets.FIREBASE_IOS_API_KEY }}
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
        run: |
          flutter pub get
          flutter build ios --release --no-codesign \
            --build-number="${{ github.run_number }}" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_IOS_API_KEY="$FIREBASE_IOS_API_KEY" \
            --dart-define=FIREBASE_IOS_APP_ID="$FIREBASE_IOS_APP_ID"
