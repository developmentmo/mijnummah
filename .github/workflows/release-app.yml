# Releasebuild van de MijnUmmah-app (één app voor alle moskeeën), alleen handmatig te starten. Bouwt en tekent;
# uploadt NIET naar de stores. Publiceren gebeurt met de hand in Play Console of App Store Connect, na de
# releasecontrole in DEPLOYMENT.md.
#
# Een GitHub Environment "productie" (Settings > Environments), met:
#   secrets   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#             FIREBASE_ANDROID_API_KEY, FIREBASE_ANDROID_APP_ID, FIREBASE_IOS_API_KEY, FIREBASE_IOS_APP_ID
#   variables API_BASE_URL (https-adres van de API), FIREBASE_PROJECT_ID, FIREBASE_MESSAGING_SENDER_ID
# Stel bij de Environment "Required reviewers" in, dan start een release pas na goedkeuring.
name: Release-app

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        required: true
        type: choice
        options: [android, ios]

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  android:
    if: inputs.platform == 'android'
    name: Android-release
    runs-on: ubuntu-latest
    environment: productie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
      - name: Backendadres controleren
        env:
          URL: ${{ vars.API_BASE_URL }}
        # Een release praat nooit met een standaardadres.
        run: |
          case "$URL" in https://*) ;; *) echo "::error::API_BASE_URL (https) ontbreekt in Environment productie"; exit 1;; esac
          echo "API_BASE_URL=$URL" >> "$GITHUB_ENV"
      - name: Tests
        working-directory: frontend/app
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Bouwen en tekenen
        working-directory: frontend/app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD \
            FIREBASE_PROJECT_ID FIREBASE_MESSAGING_SENDER_ID FIREBASE_ANDROID_API_KEY FIREBASE_ANDROID_APP_ID; do
            if [ -z "${!name}" ]; then echo "::error::$name ontbreekt in Environment productie"; exit 1; fi
          done
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          flutter build appbundle --release \
            --build-number="${{ github.run_number }}" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_ANDROID_API_KEY="$FIREBASE_ANDROID_API_KEY" \
            --dart-define=FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_APP_ID"
          rm -f "$ANDROID_KEYSTORE_PATH"
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab | grep -q "jar verified"
      - uses: actions/upload-artifact@v4
        with:
          name: mijnummah-android-${{ github.run_number }}
          path: frontend/app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  ios:
    if: inputs.platform == 'ios'
    name: iOS-build
    runs-on: macos-latest
    environment: productie
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
      - name: Backendadres controleren
        env:
          URL: ${{ vars.API_BASE_URL }}
        # Een release praat nooit met een standaardadres.
        run: |
          case "$URL" in https://*) ;; *) echo "::error::API_BASE_URL (https) ontbreekt in Environment productie"; exit 1;; esac
          echo "API_BASE_URL=$URL" >> "$GITHUB_ENV"
      # Ondertekenen en uploaden vereisen een Apple Developer-account met certificaat en provisioningprofiel;
      # tot die er zijn, bouwt deze job een ongetekend archief om te controleren dat de release bouwt.
      - name: Bouwen (ongetekend)
        working-directory: frontend/app
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_IOS_API_KEY: ${{ secrets.FIREBASE_IOS_API_KEY }}
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
        run: |
          flutter pub get
          flutter build ios --release --no-codesign \
            --build-number="${{ github.run_number }}" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_IOS_API_KEY="$FIREBASE_IOS_API_KEY" \
            --dart-define=FIREBASE_IOS_APP_ID="$FIREBASE_IOS_APP_ID"
