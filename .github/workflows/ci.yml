name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  design:
    name: Design tokens en merkassets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Gegenereerde tokens zijn actueel
        run: node design/tokens/build.mjs --check
      - name: Kleurcontrast (WCAG 2.2 AA)
        run: node design/tokens/contrast.mjs
      - name: Geen losse kleuren of fonts buiten de tokens
        run: node design/tokens/check-hardcoded.mjs
      - name: SVG's en app-iconen
        run: python3 design/branding/check_assets.py

  app:
    name: Flutter-app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Formattering (gegenereerde *.g.dart uitgezonderd)
        run: dart format --output=none --set-exit-if-changed $(find lib test -name '*.dart' ! -name '*.g.dart')
      - name: Analyse
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Android-build (debug)
        run: flutter build apk --debug

  webportaal:
    name: Webportaal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/webportaal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/webportaal/.nvmrc
          cache: npm
          cache-dependency-path: frontend/webportaal/package-lock.json
      - run: npm ci
      - name: Formattering
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
