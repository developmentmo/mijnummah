# Local development infrastructure. The application itself runs from the IDE or with ./mvnw spring-boot:run.
#   postgres: database (port 5434 on localhost, so it can run next to other projects)

name: mijnummah

services:
  postgres:
    image: postgres:17-alpine
    container_name: mijnummah-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mijnummah}
      POSTGRES_USER: ${POSTGRES_USER:-mijnummah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mijnummah}
      TZ: UTC
      PGTZ: UTC
    ports:
      # Bound to localhost only: the dev database is never reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
